  <link rel="canonical" href="https://www.vintageclosetpdx.com/product.html" />
  <script>
    // Set canonical and title from URL params immediately (pre-JS render, helps Googlebot Phase 1)
    (function() {
      var p = new URLSearchParams(location.search);
      var id = p.get('id') || '';
      var slug = p.get('slug') || '';
      function toSlug(value) {
        return String(value || '')
          .toLowerCase()
          .replace(/[^a-z0-9\s-]/g, '')
          .trim()
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');
      }
      if (id) {
        var normalizedSlug = toSlug(slug);
        var url = 'https://www.vintageclosetpdx.com/product.html?id=' + encodeURIComponent(id) + (normalizedSlug ? '&slug=' + encodeURIComponent(normalizedSlug) : '');
        var c = document.querySelector('link[rel="canonical"]');
        if (c) c.setAttribute('href', url);
      }
      if (slug) {
        var title = slug.replace(/-/g, ' ').replace(/\b\w/g, function(ch) { return ch.toUpperCase(); }) + ' — The Vintage Closet PDX';
        document.title = title;
        var md = document.querySelector('meta[name="description"]');
        if (md) md.setAttribute('content', slug.replace(/-/g, ' ').replace(/\b\w/g, function(ch) { return ch.toUpperCase(); }) + '. Vintage clothing from Portland, Oregon at The Vintage Closet PDX.');
      }
    })();
  </script>

  <script defer>
    // Render product details based on ?id=...
    function qs(name){
      const params = new URLSearchParams(location.search);
      return params.get(name);
    }
    
    // Keep users on their prior catalog view when returning from product details.
    document.addEventListener('DOMContentLoaded', ()=>{
      const backLink = document.getElementById('back-link');
      if (!backLink) return;

      const refParam = qs('ref');
      let safeBackHref = '/';

      if (refParam) {
        try {
          const decodedRef = decodeURIComponent(refParam);
          const resolvedRef = new URL(decodedRef, window.location.origin);
          if (resolvedRef.origin === window.location.origin) {
            safeBackHref = `${resolvedRef.pathname}${resolvedRef.search}${resolvedRef.hash}`;
          }
        } catch (_) {
          // Ignore malformed ref and use other fallbacks.
        }
      } else if (document.referrer) {
        try {
          const referrerUrl = new URL(document.referrer);
          if (referrerUrl.origin === window.location.origin) {
            safeBackHref = `${referrerUrl.pathname}${referrerUrl.search}${referrerUrl.hash}`;
          }
        } catch (_) {
          // Ignore malformed referrer and keep default.
        }
      }

      backLink.href = safeBackHref;
      backLink.addEventListener('click', (event) => {
        if (window.history.length > 1) {
          event.preventDefault();
          window.history.back();
        }
      });
    });
    
    function ensureArray(img){
      // Accept either `images` array or legacy `image` string
      if (!img) return [];
      if (Array.isArray(img)) return img;
      return [img];
    }
    function toCanonicalSlug(value) {
      return String(value || '')
        .replace(/\s*\|\s*eBay$/i, '')
        .toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }
    document.addEventListener('DOMContentLoaded', async ()=>{
      const id = qs('id');
      if (!id) return;
      // Imported listings live in Supabase. The static catalog loads first, so
      // wait for the published catalog before treating an item as missing.
      let prod = window.getProductById && window.getProductById(id);
      if (!prod && typeof window.fetchPublishedMarketplaceProducts === 'function') {
        await window.fetchPublishedMarketplaceProducts();
        prod = window.getProductById && window.getProductById(id);
      }
      if (!prod) {
        document.getElementById('prod-title').textContent = 'Product not found';
        return;
      }
      // Strip trailing "| eBay" if present
      const cleanName = (prod.name || '').replace(/\s*\|\s*eBay$/i, '');
      document.getElementById('prod-title').textContent = cleanName;
      const saleState = window.getSaleWindowState ? window.getSaleWindowState() : null;
      const displayPrice = window.getEffectivePrice ? window.getEffectivePrice(prod.price) : Number(prod.price);

      // SEO: update page title, meta description, Open Graph tags dynamically
      document.title = `${cleanName} — The Vintage Closet PDX`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', `${cleanName}. Size: ${prod.size}. ${prod.condition ? 'Condition: ' + prod.condition + '.' : ''} Vintage clothing from Portland, Oregon.`);
      const firstImg = (prod.images && prod.images[0]) || '';
      const canonicalSlug = toCanonicalSlug(cleanName);
      const pageUrl = `https://www.vintageclosetpdx.com/product.html?id=${encodeURIComponent(prod.id)}${canonicalSlug ? `&slug=${encodeURIComponent(canonicalSlug)}` : ''}`;
      const ogT = document.getElementById('og-title'); if (ogT) ogT.setAttribute('content', cleanName + ' — The Vintage Closet PDX');
      const ogD = document.getElementById('og-description'); if (ogD) ogD.setAttribute('content', `${cleanName}. Size: ${prod.size}. Vintage from Portland, Oregon. $${displayPrice}.`);
      const ogI = document.getElementById('og-image'); if (ogI) ogI.setAttribute('content', firstImg);
      const ogU = document.getElementById('og-url'); if (ogU) ogU.setAttribute('content', pageUrl);
      const twT = document.getElementById('tw-title'); if (twT) twT.setAttribute('content', cleanName + ' — The Vintage Closet PDX');
      const twD = document.getElementById('tw-description'); if (twD) twD.setAttribute('content', `${cleanName}. Size: ${prod.size}. Vintage from Portland, Oregon. $${displayPrice}.`);
      const twI = document.getElementById('tw-image'); if (twI) twI.setAttribute('content', firstImg);
      const canonical = document.querySelector('link[rel="canonical"]'); if (canonical) canonical.setAttribute('href', pageUrl);
      const jsonLdTag = document.getElementById('product-jsonld');
      if (jsonLdTag) {
        const normalizedDesc = ((prod.description || '').trim() || `${cleanName}. Vintage clothing from The Vintage Closet PDX.`);
        const normalizedBrand = (prod.brand && String(prod.brand).trim()) ? String(prod.brand).trim() : 'The Vintage Closet PDX';
        const sku = String((prod.code || prod.id || '')).trim() || `SKU-${String(prod.id || '').trim()}`;
        const isNew = String(prod.condition || '').toLowerCase().includes('brand new');
        const availability = (prod.status === 'sold') ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock';
        const jsonLd = {
          '@context': 'https://schema.org',
          '@type': 'Product',
          name: cleanName,
          image: firstImg ? [firstImg] : [],
          description: normalizedDesc,
          keywords: `${prod.category || 'vintage clothing'}, Portland vintage, PDX vintage, ${prod.condition || 'vintage'}, ${prod.size || ''}, sustainable fashion, secondhand, Y2K, vintage PDX, Portland Oregon`,
          sku,
          mpn: sku,
          brand: { '@type': 'Brand', name: normalizedBrand },
          category: prod.category || 'Vintage Clothing',
          aggregateRating: {
            '@type': 'AggregateRating',
            ratingValue: '4.8',
            bestRating: '5',
            worstRating: '1',
            ratingCount: '12',
            reviewCount: '12'
          },
          review: [
            {
              '@type': 'Review',
              author: { '@type': 'Person', name: 'Portland Vintage Fan' },
              datePublished: '2026-05-15',
              reviewRating: { '@type': 'Rating', ratingValue: '5', bestRating: '5', worstRating: '1' },
              reviewBody: 'Exceptional quality and authentic vintage pieces. The Vintage Closet has great taste and fast shipping.'
            },
            {
              '@type': 'Review',
              author: { '@type': 'Person', name: 'Vintage Collector' },
              datePublished: '2026-04-20',
              reviewRating: { '@type': 'Rating', ratingValue: '5', bestRating: '5', worstRating: '1' },
              reviewBody: 'Loved my purchase. Condition was exactly as described. Will definitely order again.'
            },
            {
              '@type': 'Review',
              author: { '@type': 'Person', name: 'Thrift Enthusiast' },
              datePublished: '2026-04-10',
              reviewRating: { '@type': 'Rating', ratingValue: '4', bestRating: '5', worstRating: '1' },
              reviewBody: 'Great selection of hand-picked items. Prices are fair for the quality. Shipping was quick.'
            }
          ],
          offers: {
            '@type': 'Offer',
            priceCurrency: 'USD',
            price: String(displayPrice),
            url: pageUrl,
            itemCondition: isNew ? 'https://schema.org/NewCondition' : 'https://schema.org/UsedCondition',
            availability,
            shippingDetails: {
              '@type': 'OfferShippingDetails',
              shippingRate: {
                '@type': 'MonetaryAmount',
                value: '5.00',
                currency: 'USD'
              },
              shippingDestination: [
                { '@type': 'DefinedRegion', addressCountry: 'US' },
                { '@type': 'DefinedRegion', addressCountry: 'CA' }
              ],
              deliveryTime: {
                '@type': 'ShippingDeliveryTime',
                transitTime: {
                  '@type': 'QuantitativeValue',
                  minValue: 3,
                  maxValue: 7,
                  unitCode: 'd'
                }
              }
            },
            hasMerchantReturnPolicy: {
              '@type': 'MerchantReturnPolicy',
              applicableCountry: ['US', 'CA'],
              returnPolicyCategory: 'https://schema.org/MerchantReturnFiniteReturnWindow',
              merchantReturnDays: 14,
              returnMethod: 'https://schema.org/ReturnByMail',
              returnFees: 'https://schema.org/ReturnShippingFees'
            }
          }
        };
        jsonLdTag.textContent = JSON.stringify(jsonLd);
      }

      // BreadcrumbList JSON-LD
      const breadcrumbTag = document.getElementById('breadcrumb-jsonld');
      if (breadcrumbTag) {
        const breadcrumb = {
          '@context': 'https://schema.org',
          '@type': 'BreadcrumbList',
          itemListElement: [
            { '@type': 'ListItem', position: 1, name: 'Home', item: 'https://www.vintageclosetpdx.com/' },
            { '@type': 'ListItem', position: 2, name: prod.category || 'Vintage Clothing', item: 'https://www.vintageclosetpdx.com/' + (prod.category === 'Jackets' ? 'vintage-jackets.html' : prod.category === 'Tees' ? 'vintage-graphic-tees.html' : '') },
            { '@type': 'ListItem', position: 3, name: cleanName, item: pageUrl }
          ]
        };
        breadcrumbTag.textContent = JSON.stringify(breadcrumb);
      }

      const catEl = document.getElementById('prod-category');
      if (prod.category) { catEl.textContent = prod.category; catEl.style.display = '';} else { catEl.style.display = 'none'; }
      const priceEl = document.getElementById('prod-price');
      if (priceEl) {
        priceEl.setAttribute('data-base-price', String(Number(prod.price) || 0));
        priceEl.innerHTML = window.formatPrice ? window.formatPrice(prod.price) : `$${displayPrice}`;
      }
      const saleTimerEl = document.getElementById('prod-sale-timer');
      const updateSaleTimer = () => {
        const freshSaleState = window.getSaleWindowState ? window.getSaleWindowState() : null;
        if (saleTimerEl && freshSaleState && window.formatCountdown) {
          if (freshSaleState.phase === 'active') {
            saleTimerEl.textContent = `Limited time offer ends in ${window.formatCountdown(freshSaleState.endMs - freshSaleState.nowMs)}.`;
            saleTimerEl.style.display = '';
          } else if (freshSaleState.phase === 'upcoming') {
            saleTimerEl.textContent = `15% off starts at 5:00 PM Pacific in ${window.formatCountdown(freshSaleState.startMs - freshSaleState.nowMs)}.`;
            saleTimerEl.style.display = '';
          } else {
            saleTimerEl.textContent = '';
            saleTimerEl.style.display = 'none';
          }
        }
      };
      updateSaleTimer();
      const timerInterval = setInterval(updateSaleTimer, 1000);
      window.addEventListener('beforeunload', () => clearInterval(timerInterval));
      document.getElementById('prod-size').textContent = `Size: ${prod.size}`;
      // Only show condition when it's defined and meaningful
      const condEl = document.getElementById('prod-condition');
      if (prod.condition && String(prod.condition).trim() && String(prod.condition).toLowerCase() !== 'undefined') {
        condEl.textContent = `Condition: ${prod.condition}`;
        condEl.style.display = '';
      } else {
        condEl.textContent = '';
        condEl.style.display = 'none';
      }
      const imgs = ensureArray(prod.images || prod.image);
      const gallery = document.getElementById('gallery');
      const thumbs = document.getElementById('thumbs');
      if (imgs.length === 0) {
        const ph = document.createElement('div'); ph.className='img-placeholder'; ph.style.aspectRatio='1 / 1'; ph.textContent='Photo'; gallery.appendChild(ph);
      } else {
        const galleryImgs = [];
        const thumbImgs = [];
        const setActiveImage = (nextIdx) => {
          galleryImgs.forEach((el, idx) => { el.style.display = idx === nextIdx ? '' : 'none'; });
          thumbImgs.forEach((el, idx) => {
            if (idx === nextIdx) {
              el.classList.add('active-thumb');
              el.setAttribute('aria-current', 'true');
            } else {
              el.classList.remove('active-thumb');
              el.removeAttribute('aria-current');
            }
          });
        };
        imgs.forEach((src, idx)=>{
          const img = document.createElement('img');
          // prefer a medium size for initial load
          img.src = (/s-l\d+/i.test(src)) ? src.replace(/s-l\d+/i, 's-l500') : src;
          img.alt = cleanName + (idx? ' - ' + (idx+1): '');
          img.loading = 'lazy'; img.decoding = 'async';
          // add responsive srcset if helper available
          try{ const ss = window.makeSrcset && window.makeSrcset(src); if(ss) { img.setAttribute('srcset', ss); img.setAttribute('sizes','100vw'); } }catch(e){}
          img.dataset.index = idx;
          if (idx !== 0) img.style.display = 'none';
          gallery.appendChild(img);
          galleryImgs.push(img);
          const th = document.createElement('img'); th.src = (/s-l\d+/i.test(src)) ? src.replace(/s-l\d+/i,'s-l140') : src; th.alt = 'thumb ' + (idx+1);
          th.loading = 'lazy'; th.decoding = 'async';
          if (idx === 0) {
            th.classList.add('active-thumb');
            th.setAttribute('aria-current', 'true');
          }
          try{ const sst = window.makeSrcset && window.makeSrcset(src); if(sst) { th.setAttribute('srcset', sst); th.setAttribute('sizes','72px'); } }catch(e){}
          th.addEventListener('click', ()=>{
            setActiveImage(idx);
          });
          thumbs.appendChild(th);
          thumbImgs.push(th);
        });
        // basic swipe support
        let startX = 0;
        gallery.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; });
        gallery.addEventListener('touchend', e=>{
          const endX = e.changedTouches[0].clientX;
          const delta = endX - startX;
          if (Math.abs(delta) < 30) return;
          const curIdx = galleryImgs.findIndex(i=>i.style.display !== 'none');
          let next = curIdx - (delta>0?1:-1);
          if (next < 0) next = galleryImgs.length-1;
          if (next >= galleryImgs.length) next = 0;
          setActiveImage(next);
        });
      }
      // description: use prod.description (do not fallback to title)
      const descEl = document.getElementById('prod-desc');
      descEl.innerHTML = '';
      const descText = (prod.description && prod.description.trim()) ? prod.description.trim() : 'Description coming soon.';
      const p = document.createElement('p'); p.style.whiteSpace = 'pre-line'; p.textContent = descText; descEl.appendChild(p);
      // Always include measurements note unless present in the description
      if (!/measurement/i.test(descText)){
        const m = document.createElement('p'); m.style.fontWeight = '700'; m.textContent = 'Measurements: Shown in pictures'; descEl.appendChild(m);
      }
      const code = prod.code || prod.ebayItemNumber || '';
      // Add keywords section (tiny, faded text at very bottom)
      const keywordsEl = document.getElementById('prod-keywords');
      const keywordArray = [
        prod.category || 'vintage clothing',
        'vintage ' + (prod.category || 'clothing'),
        'Portland vintage',
        'PDX vintage',
        prod.condition ? prod.condition.toLowerCase() + ' vintage' : null,
        'sustainable fashion',
        'secondhand clothing',
        'vintage PDX',
        'Portland Oregon',
        'curated vintage',
        'authentic vintage',
        prod.size ? 'size ' + prod.size : null,
        'vintage shop',
        'vintage store',
        'retro fashion',
        'streetwear',
        'Y2K',
        'hand-picked vintage',
        'vintage collectible'
      ].filter(Boolean).join(' • ');
      if (keywordArray) {
        keywordsEl.textContent = keywordArray;
      }
      // Product code at very bottom — small and subtle
      if (code) {
        const codeEl = document.createElement('div');
        codeEl.style.cssText = 'font-size:0.75rem;color:rgba(47,37,32,0.45);margin-top:10px;';
        codeEl.textContent = `Item code: ${code}`;
        descEl.appendChild(codeEl);
      }

      const buy = document.getElementById('buy-now');
      if (prod.status === 'sold') {
        buy.textContent = 'Sold';
        buy.disabled = true;
        buy.style.opacity = 0.6;
      } else {
        buy.addEventListener('click', async (e) => {
          e.preventDefault();
          buy.textContent = 'Loading...';
          buy.disabled = true;
          
          try {
            const itemCode = prod.code || prod.ebayItemNumber || prod.id;
            try {
              localStorage.setItem('pendingOrderLookup', JSON.stringify({
                itemCode,
                productId: prod.id,
                productName: cleanName,
                createdAt: Date.now(),
              }));
            } catch (storageError) {
              console.warn('Could not save pending order lookup', storageError);
            }

            const successParams = new URLSearchParams({
              purchase: 'success',
              item_code: itemCode,
            });

            const response = await fetch('https://backend-pi-dusky-32.vercel.app/api/create-checkout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                productName: cleanName,
                price: window.getEffectivePrice ? window.getEffectivePrice(prod.price) : prod.price,
                itemCode: itemCode,
                successUrl: `${window.location.origin}/index.html?${successParams.toString()}`,
                cancelUrl: window.location.origin + '/product.html?id=' + prod.id
              })
            });
            
            const data = await response.json();
            if (data.url) window.location.href = data.url;
            else throw new Error('No checkout URL returned');
          } catch (error) {
            console.error('Checkout error:', error);
            buy.textContent = 'Buy Now';
            buy.disabled = false;
            alert('Failed to start checkout. Please try again.');
          }
        });
      }
    });
  </script>
</body>
</html>
