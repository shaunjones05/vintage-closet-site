<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vintage Closet PDX Dashboard</title>
<style>
:root{--ink:#241d18;--muted:#786d62;--line:#e8e0d7;--bg:#f5f2ed;--accent:#805a38;--accent-dark:#65442a;--bad:#ad3f3d;--good:#267341;--card:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#eee3d5 0,transparent 28%),var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1240px;margin:auto;padding:32px 18px 70px}.card{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px #3d2c1a0a;border-radius:16px;padding:20px;margin:16px 0}h1,h2{margin:0 0 8px;letter-spacing:-.02em}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #d5c7ba;border-radius:9px;background:#fff}textarea{min-height:115px;resize:vertical}button{font:700 14px inherit;color:#fff;background:var(--accent);border:0;border-radius:9px;padding:10px 14px;cursor:pointer;transition:transform .12s ease,background .12s ease}button:hover{background:var(--accent-dark);transform:translateY(-1px)}button.secondary{background:#6d635a}button.danger{background:var(--bad)}button.sold{background:#b86b36}button.sold:hover{background:#925026}button:disabled{opacity:.5;transform:none}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{background:#e8ddd1;color:var(--ink)}.tabs button.active{background:var(--ink);color:#fff}.tab{display:none}.tab.active{display:block}.status{margin-top:10px;min-height:20px}.error{color:var(--bad)}.success{color:var(--good)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;transition:box-shadow .15s ease,border-color .15s ease}.product:hover{box-shadow:0 12px 26px #38281614}.product img{height:210px;width:100%;object-fit:cover;border-radius:9px;background:#eee}.product h3{font-size:16px;line-height:1.25;margin:9px 0;min-height:40px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.selected{border-color:var(--accent);outline:2px solid #805a3840;background:#fffaf5}.select-line{display:flex;align-items:center;gap:7px;margin:0 0 9px;font-size:13px}.select-line input{width:17px;height:17px;margin:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar .actions{margin:0}.count{font-size:13px;color:var(--muted);font-weight:700}#editor{position:fixed;inset:0;background:#1f160bb8;display:none;align-items:center;justify-content:center;padding:16px;z-index:2}#editor.open{display:flex}#editor .card{width:min(640px,100%);max-height:94vh;overflow:auto}.preview{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;background:#fff}.preview img{width:90px;height:90px;object-fit:cover;border-radius:7px;float:left;margin-right:12px}@media(max-width:600px){.row{grid-template-columns:1fr}.product img{height:250px}}
</style></head><body><main class="wrap">
<section id="lock" class="card"><h1>Vintage Closet PDX Dashboard</h1><p class="muted">Enter the importer password to manage listings. It is never stored in this page.</p><label>Password<input id="password" type="password" autocomplete="current-password"></label><p><button id="unlock">Unlock dashboard</button></p><div id="lock-status" class="status"></div></section>
<section id="app" class="hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Listing dashboard</h1><div class="muted">Import, edit, sell, or delist without touching code.</div></div><button id="lock-btn" class="secondary">Lock</button></div>
<div class="tabs"><button class="active" data-tab="import">Import listings</button><button data-tab="listings">Live listings</button></div>
<section id="import" class="tab active card"><h2>Import from Vinted or Depop</h2><label>URLs, one per line (up to 25)<textarea id="urls" placeholder="https://www.vinted.com/items/..."></textarea></label><button id="preview-btn">Preview listings</button><div id="import-status" class="status"></div><div id="previews"></div><p id="publish-wrap" class="hidden"><button id="publish-btn">Approve &amp; publish all</button></p></section>
<section id="listings" class="tab"><div class="card"><div class="toolbar"><div><h2>Active inventory</h2><div id="active-count" class="count">Loading listings…</div></div><div class="actions"><button id="refresh-metadata" class="secondary">Fix Vinted size &amp; condition</button><button id="reload-btn" class="secondary">Reload</button></div></div><div class="row"><label>Search listings<input id="search" placeholder="Name, code, or size"></label><div class="actions" style="align-items:end"><button id="select-visible" class="secondary">Select visible</button><button id="clear-selection" class="secondary">Clear selection</button><button id="sold-selected" class="sold">Mark as sold (0)</button><button id="delist-selected" class="danger">Delist selected (0)</button></div></div><div id="listing-status" class="status"></div></div><div id="products" class="products"></div></section>
</section></main>
<div id="editor"><form id="edit-form" class="card"><h2>Edit listing</h2><input id="edit-code" type="hidden"><label>Name<input id="edit-name" required></label><div class="row"><label>Price<input id="edit-price" type="number" min="0.01" step="0.01" required></label><label>Size<input id="edit-size"></label></div><div class="row"><label>Condition<input id="edit-condition"></label><label>Category<input id="edit-category"></label></div><label>Description<textarea id="edit-description"></textarea></label><div class="actions"><button>Save changes</button><button type="button" id="close-editor" class="secondary">Cancel</button></div><div id="edit-status" class="status"></div></form></div>
<script>
const ADMIN='/api/admin-products',IMPORT='/api/import-listings';let password='',products=[],approved=[],selectedCodes=new Set();
const $=id=>document.getElementById(id);const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};function status(id,msg,kind=''){const e=$(id);e.textContent=msg;e.className='status '+kind}async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-import-password':password},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==207)throw new Error(d.error||'Request failed.');return d}
async function load(){status('listing-status','Loading…');try{products=(await api(ADMIN,{action:'list'})).products;selectedCodes=new Set([...selectedCodes].filter(code=>products.some(p=>p.code===code)));render();status('listing-status','Showing '+products.length+' active listing'+(products.length===1?'':'s')+'.','success')}catch(e){status('listing-status',e.message,'error')}}
function selected(){return [...selectedCodes]}function visibleProducts(){const q=$('search').value.toLowerCase();return products.filter(p=>JSON.stringify([p.name,p.code,p.size]).toLowerCase().includes(q))}function updateSelection(){const n=selectedCodes.size;$('delist-selected').textContent='Delist selected ('+n+')';$('sold-selected').textContent='Mark as sold ('+n+')';$('active-count').textContent=products.length+' active · '+n+' selected';document.querySelectorAll('.pick').forEach(x=>{x.checked=selectedCodes.has(x.value);x.closest('.product').classList.toggle('selected',x.checked)})}function render(){const visible=visibleProducts();$('products').innerHTML=visible.map(p=>`<article class="product ${selectedCodes.has(p.code)?'selected':''}"><label class="select-line"><input class="pick" type="checkbox" value="${esc(p.code)}" ${selectedCodes.has(p.code)?'checked':''}> Select for bulk action</label>${p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="">':''}<h3>${esc(p.name)}</h3><div><strong>$${Number(p.price).toFixed(2)}</strong> · ${esc(p.size||'No size')}</div><div class="muted">${esc(p.code)} · ${esc(p.category||'')}</div><div class="actions"><button class="edit" data-code="${esc(p.code)}">Edit</button><button class="one-sold sold" data-code="${esc(p.code)}">Mark as sold</button><button class="one-delist danger" data-code="${esc(p.code)}">Delist</button></div></article>`).join('')||'<p class="muted">No active listings match your search.</p>';document.querySelectorAll('.pick').forEach(x=>x.onchange=()=>{x.checked?selectedCodes.add(x.value):selectedCodes.delete(x.value);updateSelection()});document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>openEdit(x.dataset.code));document.querySelectorAll('.one-sold').forEach(x=>x.onclick=()=>markSold([x.dataset.code]));document.querySelectorAll('.one-delist').forEach(x=>x.onclick=()=>delist([x.dataset.code]));updateSelection()}
function openEdit(code){const p=products.find(x=>x.code===code);$('edit-code').value=p.code;$('edit-name').value=p.name||'';$('edit-price').value=p.price||'';$('edit-size').value=p.size||'';$('edit-condition').value=p.condition||'';$('edit-category').value=p.category||'';$('edit-description').value=p.description||'';$('edit-status').textContent='';$('editor').classList.add('open')}
async function delist(codes){if(!codes.length)return;if(!confirm('Delist '+codes.length+' listing'+(codes.length===1?'':'s')+'? They will disappear from the public site.'))return;try{await api(ADMIN,{action:'delist',codes});await load()}catch(e){status('listing-status',e.message,'error')}}
async function markSold(codes){if(!codes.length)return;if(!confirm('Mark '+codes.length+' listing'+(codes.length===1?'':'s')+' as sold? They will stay visible in the public archive at the bottom, but cannot be purchased.'))return;try{await api(ADMIN,{action:'mark_sold',codes});await load()}catch(e){status('listing-status',e.message,'error')}}
async function refreshVintedMetadata(){const targets=products.filter(p=>p.source_platform==='vinted'&&p.source_url&&(!p.size||!p.condition||/^size$/i.test(p.size)||/^condition$/i.test(p.condition)));if(!targets.length){status('listing-status','No active Vinted listings need a size/condition repair.','success');return}if(!confirm('Recheck size and condition for '+targets.length+' active Vinted listing'+(targets.length===1?'':'s')+'? This will not change photos, price, title, or inventory.'))return;const button=$('refresh-metadata');button.disabled=true;let success=0,failed=0;for(let i=0;i<targets.length;i++){status('listing-status','Repairing metadata '+(i+1)+' of '+targets.length+'…');try{const result=await api(IMPORT,{mode:'refresh',urls:[targets[i].source_url]});if(result.results?.[0]?.success)success++;else failed++}catch(e){failed++}}button.disabled=false;await load();status('listing-status',success+' listing'+(success===1?'':'s')+' repaired; '+failed+' failed.',failed?'error':'success')}
$('unlock').onclick=async()=>{password=$('password').value;try{await api(ADMIN,{action:'list'});$('lock').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){status('lock-status',e.message,'error')}};$('lock-btn').onclick=()=>{password='';selectedCodes.clear();$('password').value='';$('app').classList.add('hidden');$('lock').classList.remove('hidden')};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='listings')load()});$('search').oninput=render;$('reload-btn').onclick=load;$('refresh-metadata').onclick=refreshVintedMetadata;$('select-visible').onclick=()=>{visibleProducts().forEach(p=>selectedCodes.add(p.code));updateSelection()};$('clear-selection').onclick=()=>{selectedCodes.clear();updateSelection()};$('sold-selected').onclick=()=>markSold(selected());$('delist-selected').onclick=()=>delist(selected());$('close-editor').onclick=()=> $('editor').classList.remove('open');$('edit-form').onsubmit=async e=>{e.preventDefault();const product={name:$('edit-name').value,price:$('edit-price').value,size:$('edit-size').value,condition:$('edit-condition').value,category:$('edit-category').value,description:$('edit-description').value};try{await api(ADMIN,{action:'update',codes:[$('edit-code').value],product});$('editor').classList.remove('open');await load()}catch(err){status('edit-status',err.message,'error')}};
function previewCard(r){if(!r.success)return `<div class="preview error"><strong>Could not preview</strong><br>${esc(r.sourceUrl)}<br>${esc(r.error)}</div>`;const d=r.draft||{};return `<div class="preview">${d.images?.[0]?'<img src="'+esc(d.images[0])+'" alt="">':''}<strong>${esc(d.name)}</strong><br>$${esc(d.price)} · ${esc(d.size||'No size')} · ${esc(d.condition||'No condition')}<br><span class="muted">${esc(d.platform)} · ${d.images?.length||0} photos</span><div style="clear:both"></div></div>`}
$('preview-btn').onclick=async()=>{try{const urls=[...new Set($('urls').value.split(/\n+/).map(x=>x.trim()).filter(Boolean))];if(!urls.length)throw new Error('Paste at least one URL.');status('import-status','Previewing…');const d=await api(IMPORT,{mode:'preview',urls});approved=d.results.filter(x=>x.success).map(x=>x.sourceUrl);$('previews').innerHTML=d.results.map(previewCard).join('');$('publish-wrap').classList.toggle('hidden',!approved.length);status('import-status',approved.length+' ready. Nothing has been published yet.',approved.length?'success':'error')}catch(e){status('import-status',e.message,'error')}};function publishCard(r){const d=r.product||{};return r.success?`<div class="preview success"><strong>Published</strong><br>${esc(d.name||r.sourceUrl)}<br><span class="muted">${esc(r.code||'')} · ${r.imageCount||0} photos copied</span><div style="clear:both"></div></div>`:`<div class="preview error"><strong>Could not publish</strong><br>${esc(r.sourceUrl)}<br>${esc(r.error||'Request failed.')}</div>`}$('publish-btn').onclick=async()=>{const button=$('publish-btn');button.disabled=true;const outcomes=[];for(let i=0;i<approved.length;i++){const url=approved[i];status('import-status','Publishing '+(i+1)+' of '+approved.length+' and copying photos…');try{const d=await api(IMPORT,{mode:'publish',urls:[url]});outcomes.push(d.results?.[0]||{success:false,sourceUrl:url,error:'No result returned.'})}catch(e){outcomes.push({success:false,sourceUrl:url,error:e.message})}}const success=outcomes.filter(x=>x.success).length;$('previews').innerHTML=outcomes.map(publishCard).join('');status('import-status',success+' published; '+(outcomes.length-success)+' failed. Failed items can be previewed and retried.',success===outcomes.length?'success':'error');$('publish-wrap').classList.add('hidden');button.disabled=false};
</script></body></html>
