<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vintage Closet PDX Dashboard</title>
<style>
:root{--ink:#2f2520;--muted:#6b5a4c;--line:#e6dfd6;--bg:#f8f6f2;--accent:#8a6342;--bad:#a33232;--good:#28683b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 18px 60px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}h1,h2{margin:0 0 8px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;font:inherit;padding:9px;border:1px solid #cfc3b5;border-radius:7px;background:#fff}textarea{min-height:115px;resize:vertical}button{font:700 14px inherit;color:#fff;background:var(--accent);border:0;border-radius:7px;padding:10px 14px;cursor:pointer}button.secondary{background:#62574e}button.danger{background:var(--bad)}button:disabled{opacity:.5}.tabs{display:flex;gap:8px;margin:15px 0}.tabs button{background:#ded5cc;color:var(--ink)}.tabs button.active{background:var(--accent);color:#fff}.tab{display:none}.tab.active{display:block}.status{margin-top:10px;min-height:20px}.error{color:var(--bad)}.success{color:var(--good)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.product img{height:190px;width:100%;object-fit:cover;border-radius:7px;background:#eee}.product h3{font-size:16px;margin:8px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.selected{outline:2px solid var(--accent)}#editor{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:2}#editor.open{display:flex}#editor .card{width:min(640px,100%);max-height:94vh;overflow:auto}.preview{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.preview img{width:90px;height:90px;object-fit:cover;border-radius:6px;float:left;margin-right:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section id="lock" class="card"><h1>Vintage Closet PDX Dashboard</h1><p class="muted">Enter the importer password to manage listings. It is never stored in this page.</p><label>Password<input id="password" type="password" autocomplete="current-password"></label><p><button id="unlock">Unlock dashboard</button></p><div id="lock-status" class="status"></div></section>
<section id="app" class="hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Listing dashboard</h1><div class="muted">Import, edit, or delist without touching code.</div></div><button id="lock-btn" class="secondary">Lock</button></div>
<div class="tabs"><button class="active" data-tab="import">Import listings</button><button data-tab="listings">Live listings</button></div>
<section id="import" class="tab active card"><h2>Import from Vinted or Depop</h2><label>URLs, one per line (up to 25)<textarea id="urls" placeholder="https://www.vinted.com/items/..."></textarea></label><button id="preview-btn">Preview listings</button><div id="import-status" class="status"></div><div id="previews"></div><p id="publish-wrap" class="hidden"><button id="publish-btn">Approve &amp; publish all</button></p></section>
<section id="listings" class="tab"><div class="card"><div class="row"><label>Search listings<input id="search" placeholder="Name, code, size"></label><div><label>&nbsp;</label><button id="reload-btn" class="secondary">Reload listings</button></div></div><div class="actions"><button id="delist-selected" class="danger">Delist selected (0)</button></div><div id="listing-status" class="status"></div></div><div id="products" class="products"></div></section>
</section></main>
<div id="editor"><form id="edit-form" class="card"><h2>Edit listing</h2><input id="edit-code" type="hidden"><label>Name<input id="edit-name" required></label><div class="row"><label>Price<input id="edit-price" type="number" min="0.01" step="0.01" required></label><label>Size<input id="edit-size"></label></div><div class="row"><label>Condition<input id="edit-condition"></label><label>Category<input id="edit-category"></label></div><label>Description<textarea id="edit-description"></textarea></label><div class="actions"><button>Save changes</button><button type="button" id="close-editor" class="secondary">Cancel</button></div><div id="edit-status" class="status"></div></form></div>
<script>
const ADMIN='/api/admin-products',IMPORT='/api/import-listings';let password='',products=[],approved=[];
const $=id=>document.getElementById(id);const esc=v=>{const e=document.createElement('span');e.textContent=v??'';return e.innerHTML};function status(id,msg,kind=''){const e=$(id);e.textContent=msg;e.className='status '+kind}async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-import-password':password},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok&&r.status!==207)throw new Error(d.error||'Request failed.');return d}
async function load(){status('listing-status','Loading…');try{products=(await api(ADMIN,{action:'list'})).products;render();status('listing-status',products.length+' live listing'+(products.length===1?'':'s')+'.','success')}catch(e){status('listing-status',e.message,'error')}}
function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}function render(){const q=$('search').value.toLowerCase();$('products').innerHTML=products.filter(p=>JSON.stringify([p.name,p.code,p.size]).toLowerCase().includes(q)).map(p=>`<article class="product ${selected().includes(p.code)?'selected':''}"><label><input class="pick" type="checkbox" value="${esc(p.code)}"> Select</label>${p.images?.[0]?'<img src="'+esc(p.images[0])+'" alt="">':''}<h3>${esc(p.name)}</h3><div><strong>$${Number(p.price).toFixed(2)}</strong> · ${esc(p.size||'No size')}</div><div class="muted">${esc(p.code)} · ${esc(p.category||'')}</div><div class="actions"><button class="edit" data-code="${esc(p.code)}">Edit</button><button class="one-delist danger" data-code="${esc(p.code)}">Delist</button></div></article>`).join('')||'<p class="muted">No listings found.</p>';const n=selected().length;$('delist-selected').textContent='Delist selected ('+n+')';document.querySelectorAll('.pick').forEach(x=>x.onchange=render);document.querySelectorAll('.edit').forEach(x=>x.onclick=()=>openEdit(x.dataset.code));document.querySelectorAll('.one-delist').forEach(x=>x.onclick=()=>delist([x.dataset.code]))}
function openEdit(code){const p=products.find(x=>x.code===code);$('edit-code').value=p.code;$('edit-name').value=p.name||'';$('edit-price').value=p.price||'';$('edit-size').value=p.size||'';$('edit-condition').value=p.condition||'';$('edit-category').value=p.category||'';$('edit-description').value=p.description||'';$('edit-status').textContent='';$('editor').classList.add('open')}
async function delist(codes){if(!codes.length)return;if(!confirm('Delist '+codes.length+' listing'+(codes.length===1?'':'s')+'? They will disappear from the public site.'))return;try{await api(ADMIN,{action:'delist',codes});await load()}catch(e){status('listing-status',e.message,'error')}}
$('unlock').onclick=async()=>{password=$('password').value;try{await api(ADMIN,{action:'list'});$('lock').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){status('lock-status',e.message,'error')}};$('lock-btn').onclick=()=>{password='';$('password').value='';$('app').classList.add('hidden');$('lock').classList.remove('hidden')};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='listings')load()});$('search').oninput=render;$('reload-btn').onclick=load;$('delist-selected').onclick=()=>delist(selected());$('close-editor').onclick=()=> $('editor').classList.remove('open');$('edit-form').onsubmit=async e=>{e.preventDefault();const product={name:$('edit-name').value,price:$('edit-price').value,size:$('edit-size').value,condition:$('edit-condition').value,category:$('edit-category').value,description:$('edit-description').value};try{await api(ADMIN,{action:'update',codes:[$('edit-code').value],product});$('editor').classList.remove('open');await load()}catch(err){status('edit-status',err.message,'error')}};
function previewCard(r){if(!r.success)return `<div class="preview error"><strong>Could not preview</strong><br>${esc(r.sourceUrl)}<br>${esc(r.error)}</div>`;const d=r.draft||{};return `<div class="preview">${d.images?.[0]?'<img src="'+esc(d.images[0])+'" alt="">':''}<strong>${esc(d.name)}</strong><br>$${esc(d.price)} · ${esc(d.size||'No size')} · ${esc(d.condition||'No condition')}<br><span class="muted">${esc(d.platform)} · ${d.images?.length||0} photos</span><div style="clear:both"></div></div>`}
$('preview-btn').onclick=async()=>{try{const urls=[...new Set($('urls').value.split(/\n+/).map(x=>x.trim()).filter(Boolean))];if(!urls.length)throw new Error('Paste at least one URL.');status('import-status','Previewing…');const d=await api(IMPORT,{mode:'preview',urls});approved=d.results.filter(x=>x.success).map(x=>x.sourceUrl);$('previews').innerHTML=d.results.map(previewCard).join('');$('publish-wrap').classList.toggle('hidden',!approved.length);status('import-status',approved.length+' ready. Nothing has been published yet.',approved.length?'success':'error')}catch(e){status('import-status',e.message,'error')}};$('publish-btn').onclick=async()=>{try{status('import-status','Publishing and copying photos…');const d=await api(IMPORT,{mode:'publish',urls:approved});status('import-status',(d.success||0)+' published; '+(d.failed||0)+' failed.',d.failed?'error':'success');$('publish-wrap').classList.add('hidden')}catch(e){status('import-status',e.message,'error')}};
</script></body></html>
