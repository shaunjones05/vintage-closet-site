<!DOCTYPE html>
<html>
<head>
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Mark JKT-7992 as Sold in Database</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }
        button { background: #2f2520; color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 15px; border-radius: 8px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
    <script defer src="https://cdn.vercel-analytics.com/v1/script.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YPT8JH9YNM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YPT8JH9YNM');
  </script>
</head>
<body>
    <h1>Mark JKT-7992 as Sold in Supabase</h1>
    <p>This will add/update the item in your Supabase inventory table with status "sold".</p>
    
    <button id="markSold" onclick="markItemAsSold()">Mark JKT-7992 as Sold</button>
    
    <div id="result"></div>
    
    <script>
        async function markItemAsSold() {
            const button = document.getElementById('markSold');
            const result = document.getElementById('result');
            
            button.disabled = true;
            button.textContent = 'Processing...';
            result.innerHTML = '<div class="info">Sending request to backend...</div>';
            
            try {
                // You need to set your ADMIN_SECRET_KEY here
                // Check your Vercel environment variables for the secret
                const adminSecret = prompt('Enter your ADMIN_SECRET_KEY (from Vercel env variables):');
                
                if (!adminSecret) {
                    result.innerHTML = '<div class="error">Admin secret required!</div>';
                    button.disabled = false;
                    button.textContent = 'Mark JKT-7992 as Sold';
                    return;
                }
                
                const response = await fetch('https://backend-pi-dusky-32.vercel.app/api/admin-inventory', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-secret': adminSecret
                    },
                    body: JSON.stringify({
                        item_code: 'JKT-7992',
                        status: 'sold'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.innerHTML = `
                        <div class="success">
                            <h3>✓ Success!</h3>
                            <p>JKT-7992 has been marked as sold in the database.</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            <p><strong>Now refresh your main page and the item should show as SOLD!</strong></p>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="error">
                            <h3>✗ Error</h3>
                            <p>${data.error || 'Unknown error occurred'}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="error">
                        <h3>✗ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.textContent = 'Mark JKT-7992 as Sold';
            }
        }
    </script>
</body>
</html>
